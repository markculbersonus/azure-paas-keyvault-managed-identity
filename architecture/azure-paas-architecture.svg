<rect x="93" y="242" width="482" height="475" rx="17" fill="#102b4a" stroke="#72b7eb" stroke-width="2.5" stroke-dasharray="12 8"/>
<rect x="116" y="225" width="273" height="34" rx="8" fill="#21527c"/>
<text x="132" y="248" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e8f6ff">Existing Web Infrastructure</text>
<rect x="128" y="292" width="413" height="357" rx="16" fill="#173a5e" stroke="#4e91c9" stroke-width="2" filter="url(#shadow)"/>
<text x="157" y="326" font-family="Arial,sans-serif" font-size="19" fill="#9fe1ff" font-weight="700">vnet-lab02 / snet-web</text>
<rect x="159" y="355" width="349" height="155" rx="13" fill="#173e63" stroke="#47b5f5" stroke-width="2.5"/>
<!-- VM icon -->
<rect x="181" y="384" width="76" height="63" rx="9" fill="#147db6"/>
<rect x="192" y="394" width="54" height="37" rx="3" fill="#cceeff"/>
<path d="M205 439h28 M219 431v8" stroke="#d6f2ff" stroke-width="3"/>
<text x="278" y="397" font-family="Arial,sans-serif" font-size="23" fill="#fff" font-weight="700">vm-web</text>
<text x="278" y="427" font-family="Arial,sans-serif" font-size="17" fill="#c4d9e9">Ubuntu virtual machine</text>
<text x="278" y="453" font-family="Arial,sans-serif" font-size="15" fill="#a7e7ff">System-assigned identity: On</text>
<rect x="160" y="536" width="347" height="84" rx="10" fill="#0b2b48" stroke="#8ed9f7" stroke-dasharray="7 5"/>
<text x="182" y="567" font-family="Arial,sans-serif" font-size="18" fill="#e9f5ff" font-weight="700">No stored Azure credentials</text>
<text x="182" y="595" font-family="Arial,sans-serif" font-size="15" fill="#a7c4da">VM identity used for secret access</text>
<!-- Right: PaaS services -->
<rect x="627" y="242" width="711" height="475" rx="17" fill="#102b4a" stroke="#72b7eb" stroke-width="2.5" stroke-dasharray="12 8"/>
<rect x="652" y="225" width="290" height="34" rx="8" fill="#21527c"/>
<text x="669" y="248" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#e8f6ff">Managed Azure Services</text>
