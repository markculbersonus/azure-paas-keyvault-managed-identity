<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Azure PaaS Modernization — SQL Database, Key Vault and Managed Identity</title>
<desc id="desc">Dark navy Azure architecture diagram showing an existing Ubuntu web virtual machine using system-assigned managed identity to obtain a Microsoft Entra access token, receive Key Vault Secrets User permission through Azure RBAC, and successfully retrieve the SqlAdminPassword secret from Azure Key Vault. Azure SQL Database is deployed as a managed PaaS database. No application-to-SQL connection is represented.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081a32"/><stop offset="1" stop-color="#122c49"/></linearGradient>
<marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker>
<filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity=".25"/></filter>
</defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<text x="70" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f8fafc">AZURE PAAS MODERNIZATION</text>
<text x="70" y="111" font-family="Arial,sans-serif" font-size="23" fill="#7dd3fc">Managed Identity • Azure Key Vault • Azure SQL Database</text>
<text x="70" y="146" font-family="Arial,sans-serif" font-size="16" fill="#a9bdd2">Deployed architecture  |  Central US  |  Secret access verified with HTTP 200</text>
<rect x="58" y="189" width="1324" height="590" rx="23" fill="#0c2441" stroke="#4ea8f4" stroke-width="3"/>
