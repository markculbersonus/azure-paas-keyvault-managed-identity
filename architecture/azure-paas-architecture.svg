<text x="1095" y="356" font-family="Arial,sans-serif" font-size="17" fill="#9fe1ff">kv-lab03-mark</text>
<rect x="1016" y="405" width="263" height="87" rx="10" fill="#0b2b48" stroke="#8ed9f7" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="1033" y="434" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#e9f5ff">Secret: SqlAdminPassword</text>
<text x="1033" y="458" font-family="Arial,sans-serif" font-size="15" fill="#a7e7ff">Key Vault Secrets User</text>
<text x="1033" y="479" font-family="Arial,sans-serif" font-size="14" fill="#b7d0e6">Azure RBAC scope: vault</text>
<!-- SQL card -->
<rect x="662" y="558" width="637" height="119" rx="15" fill="#173e63" stroke="#47b5f5" stroke-width="2.5" filter="url(#shadow)"/>
<ellipse cx="713" cy="589" rx="27" ry="11" fill="#147db6" stroke="#b7eaff" stroke-width="2"/>
