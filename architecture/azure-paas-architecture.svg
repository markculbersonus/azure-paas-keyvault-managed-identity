<text x="765" y="594" font-family="Arial,sans-serif" font-size="23" fill="#fff" font-weight="700">Azure SQL Database</text>
<text x="765" y="623" font-family="Arial,sans-serif" font-size="17" fill="#9fe1ff">sql-app  •  Basic tier  •  PaaS</text>
<text x="765" y="649" font-family="Arial,sans-serif" font-size="15" fill="#c4d9e9">Managed database service provisioned</text>
