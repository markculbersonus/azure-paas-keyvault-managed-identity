<path d="M508 379 H662" fill="none" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="585" y="363" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#a7e7ff">Token</text>
<path d="M957 366 H993" fill="none" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="975" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#a7e7ff">RBAC</text>
<path d="M993 509 H590 V473 H508" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="770" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#e0f2fe">Secret retrieval response • HTTP 200</text>
<text x="70" y="821" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#e5f4ff">Verified workflow</text>
<text x="243" y="821" font-family="Arial,sans-serif" font-size="17" fill="#b6d1e3">VM managed identity → Entra token → Key Vault RBAC → secret retrieval</text>
<text x="70" y="858" font-family="Arial,sans-serif" font-size="14" fill="#89a7bf">Architecture diagram • PaaS modernization and identity-based secret access • No application-to-database path shown</text>
</svg>
